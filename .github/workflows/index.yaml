name: Publish Python package index

on:
  repository_dispatch:
    types: [python-index-updated]
  workflow_dispatch:

concurrency:
  group: python-index-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out index repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install task runner
        uses: xberg-io/actions/install-task@cc89740654cef67b752113ddd87d4f0d23dda3f5
      - name: Rebuild index from every verified release archive
        id: archive
        uses: xberg-io/actions/archive-python@cc89740654cef67b752113ddd87d4f0d23dda3f5
        with:
          index-only: "true"
          repository: ${{ github.repository }}
          output-dir: site
      - name: Verify generated index
        env:
          INDEX_COUNT: ${{ steps.archive.outputs.file-count }}
          INDEX_DIR: site
        run: task index:verify
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload complete index site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
