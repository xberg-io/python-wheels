name: Publish Python package index

on:
  repository_dispatch:
    types: [python-index-updated]
  workflow_dispatch:

concurrency:
  group: python-index-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out index repository
        uses: actions/checkout@v7
      - name: Install task runner
        uses: xberg-io/actions/install-task@v1
      - name: Rebuild index from every verified release archive
        id: archive
        uses: xberg-io/actions/archive-python@v1
        with:
          index-only: "true"
          repository: ${{ github.repository }}
          output-dir: site
      - name: Verify generated index
        env:
          INDEX_COUNT: ${{ steps.archive.outputs.file-count }}
          INDEX_DIR: site
        run: task index:verify
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload complete index site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
